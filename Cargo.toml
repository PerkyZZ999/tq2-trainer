[package]
name = "tq2-trainer"
version = "1.0.0"
edition = "2024"
description = "Linux-native Titan Quest II trainer (EXP + gold; single-player / offline)"
license = "MIT"
readme = "README.md"
keywords = ["titan-quest", "trainer", "linux", "proton"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
