[package]
name = "tq2-trainer"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Linux-native Titan Quest II trainer (EXP + gold; single-player / offline)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PerkyZZ999/tq2-trainer"
homepage = "https://github.com/PerkyZZ999/tq2-trainer"
authors = ["PerkyZZ999"]
keywords = ["titan-quest", "trainer", "linux", "proton"]
categories = ["command-line-utilities"]
exclude = ["research-dumps/*"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
